name: Jekyll Build Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify output
        run: |
          echo "Jekyll build completed. Site files:"
          ls _site
          test -f _site/index.html && echo "OK: index.html generated"
          test -d _site/publications && echo "OK: publications output generated"
          test -d _site/cv && echo "OK: cv output generated"
          test -d _site/about && echo "OK: about output generated"
